<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRB ALP CBT-2 Result Checker</title>
  <meta name="description" content="Small Result Checker Widget for RRB ALP CBT-2 Examination CEN 01/2024">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Compact Widget Card -->
  <div class="widget-wrapper">
    <div class="widget-card">
      
      <!-- Top Indian Tricolor Line -->
      <div class="tricolor-line"></div>

      <!-- Compact Header -->
      <header class="widget-header">
        <div class="header-left">
          <div class="railway-badge">🚆</div>
          <div>
            <h1 class="widget-title">RRB ALP CBT-2 Result</h1>
            <p class="widget-subtitle">CEN 01/2024 • Shortlist Checker</p>
          </div>
        </div>
        <span class="status-pill"><span class="dot"></span> Live</span>
      </header>

      <!-- Widget Body -->
      <div class="widget-body">
        
        <!-- Input Form Section -->
        <form id="resultForm" autocomplete="off">
          
          <div class="form-row">
            <label for="candidateName" class="compact-label">Full Name</label>
            <input 
              type="text" 
              id="candidateName" 
              class="compact-input" 
              placeholder="Candidate Name" 
              required
            >
          </div>

          <div class="form-row grid-2">
            <div>
              <label for="mobileNumber" class="compact-label">Mobile Number</label>
              <input 
                type="tel" 
                id="mobileNumber" 
                class="compact-input" 
                placeholder="10-digit Mobile" 
                maxlength="10"
                pattern="[0-9]{10}" 
                required
              >
            </div>
            <div>
              <label for="rrbZone" class="compact-label">RRB Zone</label>
              <select id="rrbZone" class="compact-select" required>
                <option value="">Select Zone</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <label for="rollNumber" class="compact-label">Roll Number</label>
            <input 
              type="text" 
              id="rollNumber" 
              class="compact-input roll-input" 
              placeholder="Enter 16-digit Roll Number" 
              required
            >
          </div>

          <button type="submit" id="btnSubmit" class="btn-check">
            <span class="btn-spinner" id="btnSpinner"></span>
            <span id="btnText">Check Result</span>
            <span class="btn-arrow">➔</span>
          </button>
        </form>

        <!-- Dynamic Inline Result Section -->
        <div id="resultContainer" class="compact-result-box" style="display: none;">
          <!-- Injected via JavaScript -->
        </div>

      </div>

      <!-- Compact Footer -->
      <footer class="widget-footer">
        <span>Verified from Official RRB Lists</span>
        <a href="https://www.rrcb.gov.in" target="_blank" rel="noopener">Official Portal</a>
      </footer>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="results-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
